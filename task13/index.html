<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>{{%TITLE%}}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#fff;}
        .main-content{
            width:80%; padding:10px 40px; background-color:teal; border-radius:5px;
            margin:20px auto; box-shadow:0 4px 8px rgba(0,0,0,.2), 0 6px 20px rgba(0,0,0,.19);
            color:#fff; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }
        a{color:#fff; text-decoration:none; font-size:14px; font-weight:bold; margin:3px 10px;}
        a:hover{color:#232323;}
        .navbar{padding:4px 30px 10px 0; border-bottom:#232323 3px solid;}
        .page-content{text-align:center; padding-top:40px;}
        h3{margin:10px 0;}
    </style>
</head>
<body>
<div class="main-content">
    <div class="navbar">
        <!-- IMPORTANT: use proper route hrefs -->
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>
    <div class="page-content">
        <h3>{{%CONTENT%}}</h3>
    </div>
</div>
</body>
</html>
