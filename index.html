<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>WT Lab</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="text-center mb-4">Web Technologies  Lab Tasks</h1>
    <div class="row" id="taskContainer"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Add your task folders here
    const tasks = [
        {name: "Task 1", folder: "task1", desc: "Portfolio"},
        {name: "Task 2", folder: "task2", desc: "Image Hover"},
        {name: "Task 3", folder: "task3", desc: "Weather Display"},
    ];

    const container = document.getElementById("taskContainer");

    tasks.forEach(task => {
        const col = document.createElement("div");
        col.className = "col-md-4 mb-4";

        col.innerHTML = `
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">${task.name}</h5>
            <p class="card-text">${task.desc}</p>
            <a href="${task.folder}/" class="btn btn-primary">Go to ${task.name}</a>
          </div>
        </div>
      `;
        container.appendChild(col);
    });
</script>
</body>
</html>
