<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>WT Lab</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        #backBtn {
            display: none;
        }
        iframe {
            border: none;
            width: 100%;
            height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <button id="backBtn" class="btn btn-secondary mb-3">&larr; Back</button>
    <h1 class="text-center mb-4" id="pageTitle">Web Technologies Lab Tasks</h1>
    <div class="row" id="taskContainer"></div>
    <div id="taskContent" class="mt-3"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const tasks = [
        {name: "Task 1", folder: "task01", desc: "Portfolio"},
        {name: "Task 2", folder: "task02", desc: "Image Hover"},
        {name: "Task 3", folder: "task03", desc: "Weather Display"},
        {name: "Task 4", folder: "task04", desc: "Box Properties"},
        {name: "Task 5", folder: "task05", desc: "Calculator"},
        {name: "Task 8", folder: "task08", desc: "To-do List"},
        {name: "Task 10", folder: "task10", desc: "Signup Form"},
        {name: "Task 11", folder: "task11", desc: "Event Propagation Demo"},
    ];

    const container = document.getElementById("taskContainer");
    const taskContent = document.getElementById("taskContent");
    const backBtn = document.getElementById("backBtn");
    const title = document.getElementById("pageTitle");

    // Display task cards
    function showTaskList() {
        taskContent.innerHTML = "";
        container.style.display = "flex";
        title.textContent = "Web Technologies Lab Tasks";
        backBtn.style.display = "none";
    }

    tasks.forEach(task => {
        const col = document.createElement("div");
        col.className = "col-md-4 mb-4";

        col.innerHTML = `
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">${task.name}</h5>
            <p class="card-text">${task.desc}</p>
            <button class="btn btn-primary w-100">Open</button>
          </div>
        </div>
      `;

        col.querySelector("button").addEventListener("click", () => {
            loadTask(task);
        });

        container.appendChild(col);
    });

    // Load task inside same page
    function loadTask(task) {
        container.style.display = "none";
        backBtn.style.display = "inline-block";
        title.textContent = `${task.name} - ${task.desc}`;

        // Option 1: Use iframe to render safely
        taskContent.innerHTML = `<iframe src="${task.folder}/index.html"></iframe>`;

        // Option 2 (alternative): Directly fetch HTML
        /*
        fetch(`${task.folder}/index.html`)
          .then(res => res.text())
          .then(html => {
            taskContent.innerHTML = html;
          })
          .catch(err => {
            taskContent.innerHTML = "<div class='alert alert-danger'>Failed to load task content.</div>";
          });
        */
    }

    backBtn.addEventListener("click", showTaskList);
</script>
</body>
</html>
